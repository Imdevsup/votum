<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Votum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="hd">
    <div class="brand">
      <span class="seal" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <defs>
            <radialGradient id="g" cx="35%" cy="30%" r="75%">
              <stop offset="0%" stop-color="#C04050"/>
              <stop offset="60%" stop-color="#7B1F2A"/>
              <stop offset="100%" stop-color="#4A0F18"/>
            </radialGradient>
          </defs>
          <circle cx="12" cy="12" r="10" fill="url(#g)"/>
          <path d="M12 6 L13.4 10 L17.6 10 L14.2 12.4 L15.6 16.4 L12 14 L8.4 16.4 L9.8 12.4 L6.4 10 L10.6 10 Z"
                fill="#F5E6C9" opacity="0.92"/>
        </svg>
      </span>
      <span class="brand-name">Votum</span>
    </div>
    <a class="hd-link" href="#" data-marketing>About</a>
  </header>

  <main id="main" class="loading">
    <p class="loading-msg">Loading…</p>
  </main>

  <template id="t-signed-out">
    <section class="state state-signed-out">
      <h1>A bot-resistant endorsement system for GitHub.</h1>
      <p>
        Sign in with GitHub to vouch for repositories you respect.
        Each developer holds 10 active slots — your vouches are public
        and tied to your handle.
      </p>
      <button class="btn primary" data-signin>Sign in with GitHub</button>
      <p class="muted small">
        We read your public profile and following list to personalise
        results. Nothing is sent until you sign in.
      </p>
    </section>
  </template>

  <template id="t-pending">
    <section class="state state-pending">
      <div class="who" data-who></div>
      <h1>Application under review</h1>
      <p data-reason class="muted"></p>
      <p>We review applications within ~7 days.</p>
      <button class="btn ghost" data-signout>Sign out</button>
    </section>
  </template>

  <template id="t-rejected">
    <section class="state state-rejected">
      <div class="who" data-who></div>
      <h1>Not eligible</h1>
      <p data-reason class="muted"></p>
      <a class="btn primary" data-apply target="_blank" rel="noopener">Re-apply</a>
      <button class="btn ghost" data-signout>Sign out</button>
    </section>
  </template>

  <template id="t-eligible">
    <section class="state state-eligible">
      <div class="who" data-who></div>
      <div class="slots">
        <div class="slots-bar"><div class="slots-fill" data-slots-fill></div></div>
        <p class="slots-text"><strong data-slots-used></strong> of <strong data-slots-total></strong> slots used</p>
      </div>
      <h2>Your active vouches</h2>
      <ul class="vouch-list" data-vouches></ul>
      <p class="muted small empty hidden" data-empty>You haven't vouched for anything yet. Visit a GitHub repo and click the Votum button.</p>
      <button class="btn ghost" data-signout>Sign out</button>
    </section>
  </template>

  <template id="t-suspended">
    <section class="state state-suspended">
      <div class="who" data-who></div>
      <h1>Account suspended</h1>
      <p data-reason class="muted"></p>
      <button class="btn ghost" data-signout>Sign out</button>
    </section>
  </template>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
