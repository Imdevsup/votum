<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sealed — Votum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <h1 id="title">Sealed.</h1>
    <p id="msg">
      You're signed in. Close this tab and return to the Votum extension —
      your slot count and active vouches will appear there automatically.
    </p>
    <p class="muted small" id="hint">
      If the extension popup doesn't update right away, click the Votum icon
      in your toolbar.
    </p>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      if (params.get('status') === 'error') {
        document.getElementById('title').textContent = 'Something went wrong.';
        const reason = params.get('reason') || 'unknown_error';
        document.getElementById('msg').textContent =
          `We could not complete sign-in (${reason}). Try again from the extension popup.`;
      }
      // Best-effort cross-extension nudge.
      try {
        if (typeof chrome !== 'undefined' && chrome.runtime?.sendMessage) {
          chrome.runtime.sendMessage({ type: 'votum_auth_changed' }, () => {});
        }
      } catch {}
    })();
  </script>
</body>
</html>
